<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ivan Smart Connect</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="container">

        <h1>Ivan Smart Connect</h1>

        <p id="status">Checking connection...</p>

        <!-- Login Section -->
        <section id="loginSection">

            <h2>Login</h2>

            <input
                type="email"
                id="email"
                placeholder="Email address"
                autocomplete="email"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button id="loginBtn">
                Login
            </button>

            <p id="loginMessage"></p>

        </section>

        <!-- User Section -->
        <section id="userSection" style="display: none;">

            <h2>Welcome!</h2>

            <p>
                Logged in as:
                <strong id="userEmail"></strong>
            </p>

            <button id="logoutBtn">
                Logout
            </button>

        </section>

        <!-- Debug Console -->
        <section id="debugSection">

            <h3>Debug Console</h3>

            <div id="debugConsole">
                Starting...
            </div>

            <button id="clearDebugBtn">
                Clear Console
            </button>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
